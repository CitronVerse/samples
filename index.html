];const SDS_URL="https://planner-opened-smell-specialties.trycloudflare.com";
const q=document.getElementById('q'),folders=document.getElementById('folders'),samplesEl=document.getElementById('samples'),count=document.getElementById('count'),online=document.getElementById('online'),back=document.getElementById('back'),crumb=document.getElementById('crumb');let audio=null,playing='',path=[];
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function parts(c){return String(c||'Sans catégorie').split(' / ').map(x=>x.trim()).filter(Boolean)}
function atPath(x,p){const a=parts(x.category);return p.every((v,i)=>a[i]===v)}
function directFolders(items,p){const m=new Map();for(const x of items){if(!atPath(x,p))continue;const a=parts(x.category);if(a.length<=p.length)continue;const n=a[p.length];m.set(n,(m.get(n)||0)+1)}return [...m].sort((a,b)=>a[0].localeCompare(b[0],'fr'))}
function directSamples(items,p){return items.filter(x=>{const a=parts(x.category);return atPath(x,p)&&a.length===p.length}).sort((a,b)=>a.name.localeCompare(b.name,'fr'))}
function sampleHtml(x){return `<div class="sample"><div class="name">${esc(x.name)}${x.duplicate?'<span class="dup">Nom en double</span>':''}</div><div class="actions"><button class="listen" data-listen="${esc(x.id)}" ${SDS_URL?'':'disabled'}>▶ Écouter</button><button class="copy" data-copy="${esc(x.id)}">Copier</button></div></div>`}
function draw(){const t=q.value.trim().toLocaleLowerCase('fr');const searching=!!t;const a=SAMPLES.filter(x=>!t||String(x.name??'').toLocaleLowerCase('fr').includes(t)||String(x.category??'').toLocaleLowerCase('fr').includes(t));count.textContent=a.length+' sample'+(a.length>1?'s':'');if(searching){folders.innerHTML='';samplesEl.innerHTML=a.length?a.map(sampleHtml).join(''):'<div class="empty">Aucun sample trouvé.</div>';crumb.textContent='Résultats de recherche';back.hidden=true}else{const fs=directFolders(SAMPLES,path);const ss=directSamples(SAMPLES,path);folders.innerHTML=fs.map(([n,c])=>`<button class="folder" data-folder="${esc(n)}"><span class="folder-icon">📁</span><span class="folder-name">${esc(n)}</span><span class="folder-count">${c}</span></button>`).join('');samplesEl.innerHTML=ss.map(sampleHtml).join('')||(!fs.length?'<div class="empty">Ce dossier est vide.</div>':'');crumb.textContent=path.length?path.join('  ›  '):'Tous les dossiers';back.hidden=path.length===0}bind()}
function bind(){document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{path.push(b.dataset.folder);draw()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const x=SAMPLES.find(x=>String(x.id)===b.dataset.copy);if(!x)return;await navigator.clipboard.writeText(x.rewardKey||x.name);b.textContent='Copié !';setTimeout(()=>b.textContent='Copier',900)});document.querySelectorAll('[data-listen]').forEach(b=>b.onclick=()=>listen(b.dataset.listen,b))}
function stop(){if(audio){const a=audio;audio=null;a.onended=null;a.onerror=null;a.pause();a.removeAttribute('src');a.load()}playing='';document.querySelectorAll('[data-listen]').forEach(b=>b.textContent='▶ Écouter')}
function listen(id,b){if(!SDS_URL)return;if(playing===id){stop();return}stop();playing=id;b.textContent='■ Stop';const a=new Audio(SDS_URL+'/api/preview/'+encodeURIComponent(id)+'?_='+Date.now());audio=a;a.volume=.18;a.onended=()=>{if(audio===a){audio=null;playing='';document.querySelectorAll('[data-listen]').forEach(x=>x.textContent='▶ Écouter')}};a.onerror=()=>{if(audio!==a)return;audio=null;playing='';document.querySelectorAll('[data-listen]').forEach(x=>x.textContent='▶ Écouter');alert('Préécoute indisponible. Vérifie que Stream Deck Share et le tunnel Internet sont ouverts.')};a.play().catch(()=>{if(audio===a&&a.onerror)a.onerror()})}
back.onclick=()=>{path.pop();draw()};q.oninput=draw;online.textContent=SDS_URL?'🎧 Préécoute disponible lorsque Stream Deck Share est en ligne.':'🎧 Préécoute indisponible : démarre SDS avec le partage Internet.';draw();
